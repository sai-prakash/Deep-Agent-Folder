name: Production Course Quality Gate
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["progress/**"]
permissions: {contents: read}
concurrency: {group: "quality-${{ github.ref }}", cancel-in-progress: true}
jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check launch.js
          node --check course-data.js
          node --check data-v2/loader.js
          node --check datasets/pack.js
          node --check workers/runtime-worker.mjs
      - name: Curriculum, lab, landing and dataset audit
        run: node scripts/quality-gate.mjs
      - name: Secret, privacy and runtime-boundary audit
        run: python scripts/security-audit.py
      - name: Validate Python examples
        run: python -m py_compile examples/openrouter_python.py scripts/security-audit.py scripts/llm_review.py
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          for p in ['.devcontainer/devcontainer.json','manifest.webmanifest','package.json']: json.load(open(p))
          print('JSON valid')
          PY
