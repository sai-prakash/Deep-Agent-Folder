name: Release v2 controller

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  reconstruct-and-validate:
    if: github.event.issue.title == '[Release V2] reconstruct and validate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2 release branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/course-v2-rich
          fetch-depth: 0

      - name: Reconstruct exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq -w 0 23); do
            test -f ".release-v2x/part${i}"
          done
          cat $(printf '.release-v2x/part%02d ' $(seq 0 23)) | base64 -d > /tmp/course-v2.tar.xz
          mkdir -p /tmp/course-v2
          tar -tJf /tmp/course-v2.tar.xz > /tmp/course-v2-files.txt
          if grep -Eq '(^|/)\.\./|^/' /tmp/course-v2-files.txt; then
            echo 'Unsafe archive path detected' >&2
            exit 1
          fi
          tar -xJf /tmp/course-v2.tar.xz -C /tmp/course-v2
          rsync -a --delete --exclude='.git/' /tmp/course-v2/ ./
          rm -rf .release-v2x .release-v2 .bootstrap
          rm -f .github/workflows/bootstrap-v2.yml

      - name: Deterministic release gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/quality-gate.mjs
          python scripts/security-audit.py
          node --check app.js
          node --check course-data.js
          node --check workers/runtime-worker.mjs
          if compgen -G 'data-v2/*.js' > /dev/null; then for f in data-v2/*.js; do node --check "$f"; done; fi
          python -m py_compile examples/openrouter_python.py scripts/security-audit.py scripts/llm_review.py

      - name: Commit validated v2 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish validated AI Engineering Mastery v2'
          git push origin HEAD:upgrade/course-v2-rich

      - name: Record success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE" --body 'V2 reconstructed from the staged archive, deterministic quality/security gates passed, and the clean tree was pushed to `upgrade/course-v2-rich`.'
          gh issue close "$ISSUE" --reason completed
