name: Persist learner progress v2
on:
  issues:
    types: [opened, edited]
permissions: {contents: write, issues: write}
concurrency: {group: "progress-${{ github.event.issue.user.login }}", cancel-in-progress: false}
jobs:
  sync:
    if: startsWith(github.event.issue.title, '[Progress Sync]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - name: Validate evidence-backed checkpoint
        env: {EVENT_PATH: "${{ github.event_path }}"}
        run: |
          python - <<'PY'
          import json,re,os,pathlib,datetime,base64,gzip
          e=json.load(open(os.environ['EVENT_PATH'])); body=e['issue'].get('body') or ''; user=e['issue']['user']['login']; m=re.search(r'<!-- PROGRESS_JSON_START -->\s*```json\s*(.*?)\s*```\s*<!-- PROGRESS_JSON_END -->',body,re.S)
          if not m: raise SystemExit('No progress JSON')
          data=json.loads(m.group(1));
          if data.get('schemaVersion')!=2 or (data.get('user') or '').lower()!=user.lower(): raise SystemExit('Invalid v2 checkpoint identity/schema')
          b=''.join(pathlib.Path(f'data-v2/chunks/course-part-{i:02}.b64').read_text().strip() for i in range(27)); raw=json.loads(gzip.decompress(base64.b64decode(b))); valid={l['id'] for s in raw['schools'] for l in s['lessons']}
          practiced=list(dict.fromkeys(x for x in data.get('practiced',[]) if x in valid)); verified=list(dict.fromkeys(x for x in data.get('verified',[]) if x in practiced)); reviews={k:v for k,v in (data.get('reviews') or {}).items() if k in verified and isinstance(v,dict) and v.get('passed') is True and float(v.get('score',0))>=4}; verified=[x for x in verified if x in reviews]
          out={'schemaVersion':2,'user':user,'practiced':practiced,'verified':verified,'reviews':reviews,'updatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sourceIssue':e['issue']['html_url']}; pathlib.Path('progress').mkdir(exist_ok=True); pathlib.Path('progress',f'{user}.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Commit and close
        env: {GH_TOKEN: "${{ github.token }}", ISSUE: "${{ github.event.issue.number }}"}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add progress/; if ! git diff --cached --quiet; then git commit -m "progress: sync verified mastery @${{ github.event.issue.user.login }}" && git push; fi
          gh issue comment "$ISSUE" --body "Progress v2 validated and persisted."; gh issue close "$ISSUE" --reason completed
