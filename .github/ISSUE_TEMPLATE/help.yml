name: Learning help
description: Ask for a Socratic hint on a course concept or lab.
title: "[Help] "
body:
  - type: dropdown
    id: school
    attributes:
      label: School
      options: [Engineering Foundations, LLM Foundations, Grounding with Data, Agentic Systems, Evaluation-Driven Development, Operating in Production, Machine Learning Foundations, Capstone]
    validations:
      required: true
  - type: input
    id: lesson
    attributes:
      label: Lesson
      placeholder: e.g. s3-multi — Multi-agent orchestration
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include your prediction, evidence, error, trace or metric.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Where are you stuck?
    validations:
      required: true
