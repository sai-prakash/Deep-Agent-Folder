name: Manual progress checkpoint
description: Persist a compact course progress snapshot to GitHub. The course UI normally prefills this for you.
title: "[Progress Sync] @username"
body:
  - type: markdown
    attributes:
      value: "Use the course’s GitHub checkpoint button when possible. Never paste API keys or secrets here."
  - type: textarea
    id: progress
    attributes:
      label: Progress JSON
      description: Paste the compact JSON generated by the course.
      render: json
    validations:
      required: true
